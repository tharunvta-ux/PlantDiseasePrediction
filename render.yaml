# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: plant-disease-detection
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    # One worker keeps memory low (one model copy); threads handle
    # concurrent requests while Gemini calls are in flight.
    startCommand: gunicorn backend.app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MODEL_PATH
        value: saved_models/plant_disease_cnn_int8.tflite
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.8-flash
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      # Secret: entered in the Render dashboard, never committed.
      - key: LLM_API_KEY
        sync: false
